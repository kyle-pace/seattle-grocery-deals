name: Watch for new flyers

# Every 30 minutes, check each store's flyer page (scripts/watch-flyers.mjs). When a store
# posts a new flyer, start the Claude update routine for it, which reads the flyer and
# publishes it. The fingerprints live on the flyer-watch branch (state.json), so this never
# pushes to main and never triggers a deploy by itself.
#
# Secrets: ROUTINE_FIRE_URL and ROUTINE_FIRE_TOKEN, from the update routine's API trigger at
# claude.ai/code/routines. Without them the job only reports what it would start.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report; don't start the routine or save state"
        type: boolean
        default: false
      only:
        description: "Comma-separated store ids to check (empty for all)"
        required: false
        default: ""
      test_alert:
        description: "Only send a test alert push to Deals Dev"
        type: boolean
        default: false

permissions:
  contents: write # push state.json to the flyer-watch branch
  issues: write # open and close flyer-alert issues (scripts/flyer-alerts.mjs)
  id-token: write # sign in to Google Cloud for the alert push, without a key

concurrency:
  group: watch-flyers
  cancel-in-progress: false

jobs:
  watch:
    # Pinned: Playwright's browser install supports 24.04; ubuntu-latest is moving to 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get the saved fingerprints
        run: |
          if git ls-remote --exit-code --heads origin flyer-watch >/dev/null; then
            git fetch --depth 1 origin flyer-watch
            git worktree add ../state FETCH_HEAD
          else
            mkdir -p ../state && cd ../state && git init -q && git checkout -q -b flyer-watch
          fi
      - name: Install a browser (for pages that need JavaScript)
        # Only stores with "render" need it; if it fails, those stores report an error and the
        # rest are still checked.
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright@latest
          npx playwright install --with-deps chromium
      - name: Check the flyer pages
        if: inputs.test_alert != true
        env:
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: |
          extra=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then extra="--dry-run"; fi
          if [ -n "${{ inputs.only }}" ]; then extra="$extra --only ${{ inputs.only }}"; fi
          node scripts/watch-flyers.mjs --state ../state/state.json $extra
      # Alerts for the owner: a push to Deals Dev (new-deals-test, which only the owner's dev
      # build joins) and a GitHub issue each. See the top of scripts/watch-flyers.mjs.
      - id: google
        if: inputs.dry_run != true
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/70205055774/locations/global/workloadIdentityPools/github/providers/seattle-grocery-deals
          service_account: push-sender@seattle-grocery-deals-dev.iam.gserviceaccount.com
          token_format: access_token
      - name: Send alerts
        if: always() && inputs.dry_run != true
        env:
          FCM_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          FIREBASE_PROJECT_ID: seattle-grocery-deals-dev
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then node scripts/flyer-alerts.mjs --test; exit 0; fi
          node scripts/flyer-alerts.mjs --state ../state/state.json
      - name: Save the fingerprints
        if: always() && inputs.dry_run != true
        run: |
          cd ../state
          [ -f state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Flyer check $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:flyer-watch
