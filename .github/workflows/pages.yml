name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      push_topic:
        description: "Also send a test push to this FCM topic (leave empty to skip)"
        required: false
        default: ""
  schedule:
    # Hourly rebuild: refreshes /api/popular.json (what people are adding, from Amplitude) and
    # keeps previews and freshness notes on today's date.
    - cron: "20 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
        env:
          # Read-only use: counts of "Added Deal to List" for /api/popular.json. Without them the
          # build writes an empty list and the app shows top picks instead.
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          AMPLITUDE_SECRET_KEY: ${{ secrets.AMPLITUDE_SECRET_KEY }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # "New deals are in": after a deploy, tell the people who picked a store when that store's
  # new flyer goes live (scripts/new-flyers.mjs finds them; send-push.mjs sends to store-<id>
  # and to new-deals, which people with no stores picked are on). A notified/<store>/<date>
  # tag per flyer makes reruns and the hourly rebuild safe. A manual run with push_topic sends
  # a test instead (for example new-deals-test, which only debug builds join).
  # No stored key: GitHub signs in to Google Cloud as push-sender through Workload Identity
  # Federation, and that account can only send Cloud Messaging.
  notify:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_topic != '')
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the notified/... tags
      id-token: write # sign in to Google Cloud without a key
    env:
      FIREBASE_PROJECT_ID: seattle-grocery-deals-dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to compare with the commit before this push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: google
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/70205055774/locations/global/workloadIdentityPools/github/providers/seattle-grocery-deals
          service_account: push-sender@seattle-grocery-deals-dev.iam.gserviceaccount.com
          token_format: access_token
      - name: Test send
        if: github.event_name == 'workflow_dispatch'
        env:
          FCM_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          TOPIC: ${{ inputs.push_topic }}
        run: node scripts/send-push.mjs --force --topic "$TOPIC"
      - name: New deals are in
        if: github.event_name == 'push'
        env:
          FCM_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          # Stores whose flyer changed in this push, as store@start-date. Code-only merges
          # change no flyer, so they send nothing.
          found=$(node scripts/new-flyers.mjs "${{ github.event.before }}")
          stores=""; tags=""
          for s in $found; do
            tag="notified/${s%@*}/${s#*@}"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "Already announced: $tag"
            else
              stores="$stores,${s%@*}"; tags="$tags $tag"
            fi
          done
          stores="${stores#,}"
          if [ -z "$stores" ]; then echo "No new flyers in this push; not announcing."; exit 0; fi
          out=$(node scripts/send-push.mjs --stores "$stores")
          echo "$out"
          if echo "$out" | grep -q "^Sent to"; then
            for tag in $tags; do git tag "$tag"; done
            git push origin $(for tag in $tags; do echo "refs/tags/$tag"; done)
          fi
