# XcodeGen spec. Generate the Xcode project with: xcodegen generate
name: GroceryDeals
options:
  bundleIdPrefix: deals.seattlegrocery
  deploymentTarget:
    iOS: "26.0"
packages:
  KitchenUI:
    path: ../../../KitchenUI
  AmplitudeSwift:
    url: https://github.com/amplitude/Amplitude-Swift
    majorVersion: 1.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 13.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 9BF66MY8TQ
    CODE_SIGN_STYLE: Automatic
    # Empty for Deals (the public TestFlight and App Store app). The DealsDev and DealsDevWidget
    # targets set them to ".dev", " Dev" and "Dev": "Deals Dev", its own app with a DEV icon,
    # which internal TestFlight builds go to (apple/testflight.sh).
    BUNDLE_ID_SUFFIX: ""
    APP_NAME_SUFFIX: ""
    APP_ICON_SUFFIX: ""
schemes:
  # Shared (committed) so Xcode Cloud can build it.
  GroceryDeals:
    build:
      targets:
        GroceryDeals: all
    run:
      config: Debug
    archive:
      config: Release
  # Deals Dev: the internal TestFlight app (its own App Store Connect record and Xcode Cloud
  # product), installed next to Deals. Also what install-on-iphone.sh builds.
  Deals Dev:
    build:
      targets:
        DealsDev: all
    run:
      config: Debug
    archive:
      config: Release
targetTemplates:
  DealsApp:
    type: application
    platform: iOS
    sources:
      # Each target makes its own Info.plist (info: below), so the committed ones aren't copied in.
      - path: Sources
        excludes: [Info.plist]
      - Resources
    dependencies:
      - package: KitchenUI
      - package: AmplitudeSwift
      # Push only. Never add FirebaseAnalytics: Amplitude is the analytics tool.
      - package: Firebase
        product: FirebaseMessaging
      # In-app messages (Sources/Messages.swift). Still no FirebaseAnalytics.
      - package: Firebase
        product: FirebaseRemoteConfig
    entitlements:
      path: Sources/GroceryDeals.entitlements
      properties:
        # Xcode switches this to production when it signs for TestFlight and the App Store.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: deals.seattlegrocery$(BUNDLE_ID_SUFFIX)
        PRODUCT_NAME: GroceryDeals
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon$(APP_ICON_SUFFIX)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Deals$(APP_NAME_SUFFIX)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Deals adds items to the Reminders list you pick, with the price and when the sale ends, and shows which items are on sale.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  DealsWidgetBase:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes: [Info.plist]
      - Sources/Models.swift
      - Sources/Theme.swift
    dependencies:
      - package: KitchenUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: deals.seattlegrocery$(BUNDLE_ID_SUFFIX).widget
        PRODUCT_NAME: DealsWidget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Deals$(APP_NAME_SUFFIX)
        SKIP_INSTALL: YES
targets:
  GroceryDeals:
    templates: [DealsApp]
    dependencies:
      - target: DealsWidget
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Lets a search started in iPhone Spotlight continue in the app's Search tab.
        CoreSpotlightContinuation: true
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes: [remote-notification]
        # Push.swift hands the APNs token to Firebase itself; no app delegate swizzling.
        FirebaseAppDelegateProxyEnabled: false
  DealsWidget:
    templates: [DealsWidgetBase]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  DealsDev:
    templates: [DealsApp]
    dependencies:
      - target: DealsDevWidget
    settings:
      base:
        PRODUCT_NAME: DealsDev
        BUNDLE_ID_SUFFIX: .dev
        APP_NAME_SUFFIX: " Dev"
        APP_ICON_SUFFIX: Dev
    info:
      path: Dev/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Lets a search started in iPhone Spotlight continue in the app's Search tab.
        CoreSpotlightContinuation: true
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes: [remote-notification]
        # Push.swift hands the APNs token to Firebase itself; no app delegate swizzling.
        FirebaseAppDelegateProxyEnabled: false
        # Deals Dev always shows the developer menu (KitchenUI's BuildKind).
        KitchenInternalBuild: true
  DealsDevWidget:
    templates: [DealsWidgetBase]
    settings:
      base:
        PRODUCT_NAME: DealsDevWidget
        BUNDLE_ID_SUFFIX: .dev
        APP_NAME_SUFFIX: " Dev"
    info:
      path: DevWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
