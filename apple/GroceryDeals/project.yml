# XcodeGen spec. Generate the Xcode project with: xcodegen generate
name: GroceryDeals
options:
  bundleIdPrefix: deals.seattlegrocery
  deploymentTarget:
    iOS: "26.0"
packages:
  KitchenUI:
    path: ../../../KitchenUI
  AmplitudeSwift:
    url: https://github.com/amplitude/Amplitude-Swift
    majorVersion: 1.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 13.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 9BF66MY8TQ
    CODE_SIGN_STYLE: Automatic
    # Empty for Deals (the public TestFlight and App Store app). The DealsDev and DealsDevWidget
    # targets set them to ".dev", " Dev" and "Dev": "Deals Dev", its own app with a DEV icon,
    # which internal TestFlight builds go to (apple/testflight.sh).
    BUNDLE_ID_SUFFIX: ""
    APP_NAME_SUFFIX: ""
    # The Home Screen name: "Grocery Deals" (owner's call, 2026-11-14; it matches the site's Home
    # Screen name). Deals Dev keeps its short name so it fits under the icon.
    APP_DISPLAY_NAME: Grocery Deals
    APP_ICON_SUFFIX: ""
schemes:
  # Shared (committed) so Xcode Cloud can build it.
  GroceryDeals:
    build:
      targets:
        GroceryDeals: all
    run:
      config: Debug
    archive:
      config: Release
  # Deals Dev: the internal TestFlight app (its own App Store Connect record and Xcode Cloud
  # product), installed next to Deals. Also what install-on-iphone.sh builds.
  Deals Dev:
    build:
      targets:
        DealsDev: all
    run:
      config: Debug
    archive:
      config: Release
targetTemplates:
  DealsApp:
    type: application
    platform: iOS
    sources:
      # Each target makes its own Info.plist (info: below), so the committed ones aren't copied in.
      - path: Sources
        excludes: [Info.plist]
      - Resources
      # Shared with the widget extension: what the widgets read, and the control's intent.
      - Shared
      # Siri AI app skills (Skills.skillsbundle). Compiled by Xcode 27.3 and later.
      - Skills.skillsbundle
    dependencies:
      - package: KitchenUI
      - package: AmplitudeSwift
      # Push only. Never add FirebaseAnalytics: Amplitude is the analytics tool.
      - package: Firebase
        product: FirebaseMessaging
      # In-app messages (Sources/Messages.swift). Still no FirebaseAnalytics.
      - package: Firebase
        product: FirebaseRemoteConfig
    entitlements:
      path: Sources/GroceryDeals.entitlements
      properties:
        # Xcode switches this to production when it signs for TestFlight and the App Store.
        aps-environment: development
        # Your stores, the filters and the list, for the widgets (Shared/SharedState.swift).
        com.apple.security.application-groups: [group.deals.seattlegrocery$(BUNDLE_ID_SUFFIX)]
        # iCloud: settings in the key-value store (CloudSettings.swift) and the list in CloudKit
        # (ListSync.swift), in the person's own iCloud. Deals and Deals Dev each have their own
        # container, so testing never touches a real list.
        com.apple.developer.icloud-container-identifiers: [iCloud.deals.seattlegrocery$(BUNDLE_ID_SUFFIX)]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: deals.seattlegrocery$(BUNDLE_ID_SUFFIX)
        PRODUCT_NAME: GroceryDeals
        # Shared/AddToListControl.swift is in the widget extension too; this marks the app's copy.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEALS_APP"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon$(APP_ICON_SUFFIX)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Grocery Deals adds items to the Reminders list you pick, with the price and when the sale ends, and shows which items are on sale.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  DealsWidgetBase:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes: [Info.plist]
      - Shared
      - Sources/Models.swift
      - Sources/Theme.swift
    dependencies:
      - package: KitchenUI
    entitlements:
      path: Widget/DealsWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.deals.seattlegrocery$(BUNDLE_ID_SUFFIX)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: deals.seattlegrocery$(BUNDLE_ID_SUFFIX).widget
        PRODUCT_NAME: DealsWidget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        SKIP_INSTALL: YES
targets:
  GroceryDeals:
    templates: [DealsApp]
    dependencies:
      - target: DealsWidget
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        DealsAppGroup: group.deals.seattlegrocery$(BUNDLE_ID_SUFFIX)
        DealsCloudContainer: iCloud.deals.seattlegrocery$(BUNDLE_ID_SUFFIX)
        # Links from the widgets and from a deal's Reminders item (DealsLink). Each app has its
        # own scheme, so a link opens the app it came from when both are installed.
        DealsLinkScheme: grocerydeals
        CFBundleURLTypes:
          - CFBundleURLName: deals.seattlegrocery
            CFBundleURLSchemes: [grocerydeals]
        # Lets a search started in iPhone Spotlight continue in the app's Search tab.
        CoreSpotlightContinuation: true
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes: [remote-notification]
        # Push.swift hands the APNs token to Firebase itself; no app delegate swizzling.
        FirebaseAppDelegateProxyEnabled: false
  DealsWidget:
    templates: [DealsWidgetBase]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DealsAppGroup: group.deals.seattlegrocery$(BUNDLE_ID_SUFFIX)
        DealsLinkScheme: grocerydeals
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  DealsDev:
    templates: [DealsApp]
    dependencies:
      - target: DealsDevWidget
    settings:
      base:
        PRODUCT_NAME: DealsDev
        BUNDLE_ID_SUFFIX: .dev
        APP_NAME_SUFFIX: " Dev"
        APP_DISPLAY_NAME: Deals Dev
        APP_ICON_SUFFIX: Dev
    info:
      path: Dev/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        DealsAppGroup: group.deals.seattlegrocery$(BUNDLE_ID_SUFFIX)
        DealsCloudContainer: iCloud.deals.seattlegrocery$(BUNDLE_ID_SUFFIX)
        # Links from the widgets and from a deal's Reminders item (DealsLink). Each app has its
        # own scheme, so a link opens the app it came from when both are installed.
        DealsLinkScheme: grocerydealsdev
        CFBundleURLTypes:
          - CFBundleURLName: deals.seattlegrocery.dev
            CFBundleURLSchemes: [grocerydealsdev]
        # Lets a search started in iPhone Spotlight continue in the app's Search tab.
        CoreSpotlightContinuation: true
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes: [remote-notification]
        # Push.swift hands the APNs token to Firebase itself; no app delegate swizzling.
        FirebaseAppDelegateProxyEnabled: false
        # Deals Dev always shows the developer menu (KitchenUI's BuildKind).
        KitchenInternalBuild: true
  DealsDevWidget:
    templates: [DealsWidgetBase]
    settings:
      base:
        PRODUCT_NAME: DealsDevWidget
        BUNDLE_ID_SUFFIX: .dev
        APP_NAME_SUFFIX: " Dev"
        APP_DISPLAY_NAME: Deals Dev
    info:
      path: DevWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DealsAppGroup: group.deals.seattlegrocery$(BUNDLE_ID_SUFFIX)
        DealsLinkScheme: grocerydealsdev
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
