# XcodeGen spec. Generate the Xcode project with: xcodegen generate
name: GroceryDeals
options:
  bundleIdPrefix: deals.seattlegrocery
  deploymentTarget:
    iOS: "26.0"
packages:
  KitchenUI:
    path: ../../../KitchenUI
  AmplitudeSwift:
    url: https://github.com/amplitude/Amplitude-Swift
    majorVersion: 1.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 13.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 9BF66MY8TQ
    CODE_SIGN_STYLE: Automatic
    # Empty for TestFlight and the App Store. apple/install-on-iphone.sh sets them to ".dev",
    # " Dev" and "Dev" so the phone build is "Deals Dev" with a DEV icon, next to the real app.
    BUNDLE_ID_SUFFIX: ""
    APP_NAME_SUFFIX: ""
    APP_ICON_SUFFIX: ""
schemes:
  # Shared (committed) so Xcode Cloud can build it.
  GroceryDeals:
    build:
      targets:
        GroceryDeals: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  GroceryDeals:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: KitchenUI
      - package: AmplitudeSwift
      # Push only. Never add FirebaseAnalytics: Amplitude is the analytics tool.
      - package: Firebase
        product: FirebaseMessaging
      - target: DealsWidget
    entitlements:
      path: Sources/GroceryDeals.entitlements
      properties:
        # Xcode switches this to production when it signs for TestFlight and the App Store.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: deals.seattlegrocery$(BUNDLE_ID_SUFFIX)
        PRODUCT_NAME: GroceryDeals
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon$(APP_ICON_SUFFIX)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Deals$(APP_NAME_SUFFIX)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Deals adds items to the Reminders list you pick, with the price and when the sale ends, and shows which items are on sale.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Lets a search started in iPhone Spotlight continue in the app's Search tab.
        CoreSpotlightContinuation: true
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes: [remote-notification]
        # Push.swift hands the APNs token to Firebase itself; no app delegate swizzling.
        FirebaseAppDelegateProxyEnabled: false
  DealsWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Sources/Models.swift
      - Sources/Theme.swift
    dependencies:
      - package: KitchenUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: deals.seattlegrocery$(BUNDLE_ID_SUFFIX).widget
        PRODUCT_NAME: DealsWidget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Deals$(APP_NAME_SUFFIX)
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
