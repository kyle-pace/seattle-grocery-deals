<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seattle Grocery Deals prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a newspaper grocery page. Brand header, then one clear job per page: home summarizes, department/store/compare pages hold the full lists. */
:root {
  --paper: #F7F5F0; --ink: #141414; --muted: #57534C; --line: #DDD8CE; --line-ui: #8C867B;
  --raised: #FFFFFF; --tag: #FFE45C; --on-tag: #141414; --red: #B3261E; --focus: #1A5FD6;
  --brand: #1D4D33; --on-brand: #FFFFFF;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
  --stick: 0px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #151412; --ink: #F2EFE8; --muted: #ADA79C; --line: #2E2B27; --line-ui: #6E685F; --raised: #1E1C19; --red: #FF8A80; --focus: #7DB0FF; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #151412; --ink: #F2EFE8; --muted: #ADA79C; --line: #2E2B27; --line-ui: #6E685F; --raised: #1E1C19; --red: #FF8A80; --focus: #7DB0FF; color-scheme: dark; }
:root[data-paper="sage"] { --paper: #EEF2EA; --muted: #4F564C; --line: #D3DBCD; --line-ui: #7F8A7A; }
@media (prefers-color-scheme: dark) { :root[data-paper="sage"]:not([data-theme="light"]) { --paper: #111612; --muted: #A3AE9F; --line: #263028; --line-ui: #66725F; --raised: #18201A; } }
:root[data-paper="sage"][data-theme="dark"] { --paper: #111612; --muted: #A3AE9F; --line: #263028; --line-ui: #66725F; --raised: #18201A; }
:root[data-brand="action"] { --brand: #69BE28; --on-brand: #141414; }
:root[data-brand="magenta"] { --brand: #B5136F; }
:root[data-brand="teal"] { --brand: #0B6B6B; }
:root[data-brand="ink"] { --brand: #141414; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -80px; background: var(--ink); color: var(--paper); padding: 10px 14px; z-index: 50; }
.skip:focus { top: 12px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; }
@media (min-width: 760px) { .wrap { padding-inline: 40px; } .bar { position: sticky; top: 0; } }

/* Prototype settings (not part of the design) */
.proto { background: #2A2730; color: #F2EFE8; font-size: 14px; }
.proto summary { cursor: pointer; padding: 8px 20px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
.proto summary::-webkit-details-marker { display: none; }
.proto summary span { font-weight: 400; opacity: .8; }
.proto .dials { display: flex; flex-wrap: wrap; gap: 10px 24px; padding: 4px 20px 14px; }
.dial { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.dial > span { font-weight: 700; }
.seg { display: flex; flex-wrap: wrap; border: 1px solid #5A5562; border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: none; color: #F2EFE8; padding: 5px 10px; cursor: pointer; font-size: 13px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: #F2EFE8; color: #1B1720; }

/* Header and navigation */
.site-head { background: var(--brand); color: var(--on-brand); }
.site-head .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; }
.brand { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; min-height: 44px; }
.brand svg { width: 26px; height: 26px; }
.topnav { display: none; gap: 4px; }
.topnav a { text-decoration: none; font-weight: 700; font-size: 16px; padding: 10px 12px; border-radius: 6px; min-height: 44px; display: inline-flex; align-items: center; }
.topnav a[aria-current="page"] { box-shadow: inset 0 -3px 0 currentColor; border-radius: 0; }
.topnav a:hover { background: rgb(255 255 255 / .12); }
@media (min-width: 760px) { .topnav { display: flex; } }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--paper); border-top: 1.5px solid var(--line-ui); display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom); }
.tabbar a { text-decoration: none; display: grid; justify-items: center; gap: 2px; padding: 8px 4px 10px; font-size: 13px; font-weight: 700; color: var(--muted); min-height: 56px; }
.tabbar a svg { width: 24px; height: 24px; }
.tabbar a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 3px 0 var(--brand); }
body { padding-bottom: 76px; }
@media (min-width: 760px) { .tabbar { display: none; } body { padding-bottom: 0; } }
.treeline { display: none; }
:root[data-trees="on"] .treeline { display: block; height: 24px; background: var(--paper); margin-top: -1px; -webkit-mask: var(--trees) repeat-x left bottom / 140px 24px; mask: var(--trees) repeat-x left bottom / 140px 24px; }
.site-head + .treeline-wrap { background: var(--brand); }

/* Page heads */
.hero { background: var(--brand); color: var(--on-brand); padding: 8px 0 28px; }
.hero h1 { font-family: var(--display); font-weight: 700; font-size: clamp(40px, 8vw, 72px); line-height: .95; margin: 0 0 8px; text-transform: uppercase; text-wrap: balance; }
.hero p { margin: 0; font-size: 16px; }
.crumbs { font-size: 15px; padding-top: 20px; color: var(--muted); }
.crumbs a { font-weight: 700; color: var(--ink); }
.page-h { padding: 8px 0 16px; border-bottom: 3px solid var(--ink); }
.page-h h1 { font-family: var(--display); font-weight: 700; font-size: clamp(36px, 6vw, 56px); line-height: 1; margin: 6px 0 6px; text-transform: uppercase; }
.page-h p { margin: 0; color: var(--muted); }
h1:focus { outline: none; }

/* Controls */
.bar { position: static; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line-ui); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding-block: 12px; }
.find { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line-ui); border-radius: 8px; background: var(--raised); padding: 0 12px; min-height: 44px; }
.find:focus-within { outline: 3px solid var(--focus); outline-offset: 1px; }
.find label { font-weight: 700; font-size: 15px; }
.find input { flex: 1; min-width: 0; border: 0; background: none; font-size: 17px; padding: 8px 0; outline: none; }
.pick { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
.pick select { min-height: 44px; border: 1.5px solid var(--line-ui); border-radius: 8px; background: var(--raised); padding: 0 10px; font-size: 16px; font-weight: 400; }
.switch { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; min-height: 44px; font-weight: 700; font-size: 16px; padding: 0 4px; }
.switch .track { width: 44px; height: 26px; border-radius: 13px; border: 2px solid var(--line-ui); position: relative; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--line-ui); transition: transform .15s; }
.switch[aria-checked="true"] .track { background: var(--ink); border-color: var(--ink); }
.switch[aria-checked="true"] .track::after { background: var(--paper); transform: translateX(18px); }
.switch .st { font-weight: 400; color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .switch .track::after { transition: none; } }

/* Sections */
section.block { margin: 36px 0; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; border-bottom: 3px solid var(--ink); padding-bottom: 6px; margin-bottom: 4px; }
.sec-h h2 { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1; margin: 0; text-transform: uppercase; }
.sec-h p { margin: 0; color: var(--muted); font-size: 15px; }
.go { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }
.go::after { content: "→"; text-decoration: none; }

/* Deal rows */
ul.deals { list-style: none; margin: 0; padding: 0; }
ul.deals li { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.nm { font-weight: 700; margin: 0; line-height: 1.3; }
.mt { margin: 2px 0 0; font-size: 15px; color: var(--muted); }
.mt s { text-decoration-thickness: 1.5px; }
.mt .off { color: var(--red); font-weight: 700; }
.why { margin: 4px 0 0; font-size: 15px; }
.lbl { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border: 1.5px solid currentColor; border-radius: 4px; padding: 0 5px; margin-right: 6px; vertical-align: 1px; }
.amt { margin: 0; flex: none; text-align: right; font-family: var(--display); font-weight: 700; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.amt .c { font-size: 18px; vertical-align: .55em; margin-right: 1px; }
.amt .u { font-size: 18px; }
.amt .ld { display: block; font-family: var(--body); font-size: 13px; line-height: 1.2; margin-bottom: 2px; }
.amt.tag > span[aria-hidden] { display: inline-block; background: var(--tag); color: var(--on-tag); padding: 4px 8px 2px; box-shadow: 3px 3px 0 var(--ink); }
:root[data-tilt="on"] .amt.tag > span[aria-hidden] { transform: rotate(-3deg); }
@media (prefers-reduced-motion: reduce) { :root[data-tilt="on"] .amt.tag > span[aria-hidden] { transform: none; } }

/* Best this week: a two-column list on wide screens */
.best ul.deals { display: grid; column-gap: 32px; }
@media (min-width: 760px) { .best ul.deals { grid-template-columns: 1fr 1fr; } }

/* Story */
.story { border: 2px solid var(--on-tag); background: var(--tag); color: var(--on-tag); padding: 18px 20px; display: grid; gap: 6px; box-shadow: 5px 5px 0 var(--ink); }
:root[data-tilt="on"] .story { transform: rotate(-0.6deg); }
.story .k { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.story h2 { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; margin: 0; text-transform: uppercase; }
.story p { margin: 0; max-width: 62ch; }
.story a { font-weight: 700; }

/* Tiles: departments and stores */
.tiles { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .tiles { grid-template-columns: 1fr 1fr; } }
@media (min-width: 960px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
.tile { display: grid; gap: 4px; padding: 14px 16px; border: 1.5px solid var(--line-ui); border-radius: 8px; background: var(--raised); text-decoration: none; min-height: 44px; }
.tile:hover { border-color: var(--ink); }
.tile .t { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.05; text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; }
.tile .t::after { content: "→"; font-family: var(--body); font-size: 20px; }
.tile .n { color: var(--muted); font-size: 15px; }
.tile .top { font-size: 15px; }
.tile .top b { font-weight: 700; }
.tile.dim { background: transparent; border-style: dashed; }

/* List pages */
.tools { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.groups { display: grid; gap: 8px 40px; }
.group-h { font-family: var(--display); font-weight: 700; font-size: 24px; text-transform: uppercase; margin: 28px 0 0; padding-bottom: 4px; border-bottom: 2px solid var(--ink); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.group-h span { font-family: var(--body); font-weight: 400; font-size: 15px; color: var(--muted); text-transform: none; }
.empty { padding: 28px 0; color: var(--muted); }
table.cmp { width: 100%; border-collapse: collapse; margin-top: 4px; }
table.cmp th, table.cmp td { text-align: left; padding: 10px 8px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 16px; }
table.cmp th { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
table.cmp td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
table.cmp tr.win td:first-child::before { content: "Cheapest"; display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.cmp-wrap { overflow-x: auto; }
.foot { border-top: 3px solid var(--ink); margin-top: 48px; padding: 18px 0 32px; color: var(--muted); font-size: 15px; display: grid; gap: 6px; }
.foot nav { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.foot nav a { font-weight: 700; color: var(--ink); min-height: 44px; display: inline-flex; align-items: center; }
.flyer { border: 1.5px solid var(--line-ui); border-radius: 8px; padding: 12px 16px; margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: center; justify-content: space-between; }
.flyer b { font-weight: 700; }

/* Store actions, delivery and spotlight */
.actions { display: flex; flex-wrap: wrap; gap: 10px 12px; margin: 18px 0 4px; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 8px; font-weight: 700; font-size: 17px; text-decoration: none; border: 2px solid var(--ink); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.secondary { background: transparent; color: var(--ink); }
.btn .ext { font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; border: 1.5px solid var(--ink); border-radius: 999px; padding: 1px 9px; }
.chip.spot { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.note-card { border: 1.5px solid var(--line-ui); border-radius: 8px; padding: 12px 16px; margin-top: 14px; display: grid; gap: 2px; }
.note-card b { font-weight: 700; }
.note-card .todo { color: var(--muted); font-size: 15px; }
.spot-card { border: 2px solid var(--ink); border-left: 12px solid var(--brand); padding: 18px 20px; display: grid; gap: 8px; background: var(--raised); }
.spot-card .k { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.spot-card h2 { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; margin: 0; text-transform: uppercase; }
.spot-card p { margin: 0; max-width: 62ch; }
.spot-card ul.deals li:last-child { border-bottom: 0; }
.spot-banner { border-left: 12px solid var(--brand); background: var(--raised); border-block: 1px solid var(--line); padding: 14px 18px; margin-top: 16px; display: grid; gap: 4px; }
.spot-banner b { font-weight: 700; }
.tile .chips { margin-top: 2px; }
</style>
</head>

function price(p) {
  const c = p.match(/^(\d+)¢\s*(.*)$/);
  if (c) return { ld: "", amt: c[1] + "¢", u: "", detail: c[2].replace(/^for /, ""), cents: true };
  let m = p.match(/^(\d+) for \$([\d.]+)(?: \((.+)\))?$/);
  if (m) return { ld: m[1] + " for", amt: m[2], u: "", detail: m[3] || "" };
  m = p.match(/^\$([\d.]+)(\/[a-z]+)?\s*(.*)$/);
  if (m) return { ld: "", amt: m[1], u: m[2] || "", detail: m[3].replace(/^for /, "") };
  return { ld: "", amt: p, u: "", detail: "" };
}

function amt(i) {

}
function meta(i, { store = true } = {}) {

  if (store) parts.push(`<a href="#" data-go="store" data-arg="${i.sid}">${esc(i.s)}</a>`);

  if (i.off) parts.push(`<span class="off">${i.off}% off</span>`);

function row(i, opts = {}) {

}

}
function viewStores() {
  const list = S.deliv ? DATA.stores.filter(s => delivers(s.id)) : DATA.stores;
  return `<main id="main" class="wrap"><div class="page-h" style="margin-top:20px"><h1 id="h1" tabindex="-1">Stores</h1><p>The specialty markets, co-ops and seafood shops we read every Friday. A map would sit here too.</p></div>
    <div class="tools"><button class="switch" role="switch" aria-checked="${!!S.deliv}" data-deliv><span class="track" aria-hidden="true"></span>Only stores that deliver <span class="st" aria-hidden="true">${S.deliv ? "On" : "Off"}</span></button></div>
    ${status(`${list.length} stores`)}
    <ul class="tiles">${list.map(s => s.count ? `<li><a class="tile" href="#" data-go="store" data-arg="${s.id}"><span class="t">${esc(s.name)}</span>${storeChips(s.id)}<span class="n">${s.count} deals, ${s.standouts} standouts · ${uniq(s.where).join(", ")}</span><span class="top">Flyer ${fmtShort(s.from)} to ${fmtShort(s.through)}</span></a></li>`
      : `<li><div class="tile dim"><span class="t" style="--x:0">${esc(s.name)}</span><span class="n">No deals this week: their flyer couldn't be read.</span></div></li>`).join("")}</ul></main>${foot()}`;
}
function viewStore() {
  const s = storeById[S.arg];
  const l = DATA.items.filter(i => i.sid === s.id && (!S.veg || i.veg));
  const q = S.q.trim().toLowerCase(); const list = q ? l.filter(i => i.n.toLowerCase().includes(q)) : l;
  const x = EXTRA[s.id];
  const spot = SPOTLIGHT.store === s.id;
  return `<main id="main" class="wrap"><p class="crumbs"><a href="#" data-go="stores">Stores</a> / ${esc(s.name)}</p>
    <div class="page-h"><h1 id="h1" tabindex="-1">${esc(s.full)}</h1><p>${uniq(s.where).join(" · ")}${s.from ? ` · Sale runs ${fmtDay(s.from)} to ${fmtDay(s.through)}` : ""}</p>
      <div class="actions">
        ${s.flyer ? `<a class="btn primary" href="${esc(s.flyer)}" target="_blank" rel="noopener">See ${esc(s.name)}'s weekly ad <span class="ext" aria-hidden="true">↗</span><span class="vh">(opens their site)</span></a>` : ""}
        <a class="btn secondary" href="#deals">This week's ${l.length} deals here</a>
        ${s.website ? `<a class="btn secondary" href="${esc(s.website)}" target="_blank" rel="noopener">Store website <span class="ext" aria-hidden="true">↗</span><span class="vh">(opens their site)</span></a>` : ""}
      </div></div>
    ${spot ? `<div class="spot-banner"><b>Spotlight: ${esc(SPOTLIGHT.title)}</b><span>${esc(SPOTLIGHT.text)}</span></div>` : ""}
    ${x?.delivery ? `<div class="note-card"><b>Delivery</b><span>${esc(x.delivery)}</span><span class="todo">${esc(x.todo)}</span></div>` : ""}
    <div class="sec-h" id="deals" style="margin-top:28px;scroll-margin-top:80px"><h2>Deals at ${esc(s.name)} this week</h2><p>${l.length} deals${S.veg ? ", vegetarian only" : ""}, ${s.standouts} standouts</p></div></main>
    ${controls({ store: false, sort: true })}
    <div class="wrap">${status(`${list.length} deals`)}${list.length ? grouped(list, { store: false }) : `<p class="empty">No deals here with these filters.</p>`}</div>${foot()}`;
}
function viewCompare() {
  const groups = DATA.compare.map(g => {
    const rows = g.rows.slice().sort((a, b) => parseFloat(a.up.slice(1)) - parseFloat(b.up.slice(1)));
    const sameUnit = new Set(rows.map(r => r.up.replace(/^\$[\d.]+/, ""))).size === 1;
    return { ...g, rows, sameUnit, title: g.key.replace(/-/g, " ").replace(/^\w/, c => c.toUpperCase()) };
  });
  const focus = S.arg ? groups.filter(g => g.key === S.arg) : groups;
  return `<main id="main" class="wrap">${S.arg ? `<p class="crumbs"><a href="#" data-go="compare">Compare</a> / ${esc(focus[0].title)}</p>` : ""}
    <div class="page-h" style="${S.arg ? "" : "margin-top:20px"}"><h1 id="h1" tabindex="-1">${S.arg ? "Compare " + esc(focus[0].title.toLowerCase()) : "Compare stores"}</h1><p>The same item on sale at more than one store, cheapest first by price per unit.</p></div>
    ${focus.map(g => `<section class="block" aria-labelledby="c-${g.key}"><div class="sec-h"><h2 id="c-${g.key}">${esc(g.title)}</h2><p>${g.rows.length} stores</p></div>
      <div class="cmp-wrap"><table class="cmp"><thead><tr><th scope="col">Item</th><th scope="col">Store</th><th scope="col">Sale price</th><th scope="col">Per unit</th></tr></thead>
      <tbody>${g.rows.map((r, n) => `<tr class="${n === 0 && g.sameUnit ? "win" : ""}"><td>${esc(r.n)}</td><td>${esc(r.s)}</td><td class="num">${esc(r.p)}</td><td class="num">${esc(r.up)}</td></tr>`).join("")}</tbody></table></div></section>`).join("")}
    ${S.arg ? `<a class="go" href="#" data-go="compare">All ${groups.length} comparisons</a>` : ""}</main>${foot()}`;
}
function viewAbout() {
  return `<main id="main" class="wrap"><div class="page-h" style="margin-top:20px"><h1 id="h1" tabindex="-1">About</h1><p>The weekly sales at Seattle's specialty grocers, in one place.</p></div>
    <div style="max-width:62ch"><p>Every Friday we read the weekly flyers from the Asian markets, seafood shops and co-ops that the big chains' apps skip, and list every food deal with its price per unit.</p>
    <p>Standouts are big drops from the regular price, prices well under the US average, the lowest price we've listed, or the cheapest of several stores.</p>
    <p>The real About page, privacy notice and how-we-choose-stores text would live here.</p></div></main>${foot()}`;
}
const VIEWS = { home: viewHome, search: viewSearch, best: viewBest, dept: viewDept, depts: viewDepts, stores: viewStores, store: viewStore, compare: viewCompare, about: viewAbout };

function render({ focus = false } = {}) {
  renderShell();
  document.getElementById("view").innerHTML = VIEWS[S.view]();
  if (focus) { scrollTo(0, 0); const h = document.getElementById("h1"); if (h) h.focus({ preventScroll: true }); }
}
function go(view, arg = null) {
  S.view = view; S.arg = arg; S.q = "";
  if (view === "store") S.store = "";
  try { history.pushState({ view, arg }, ""); } catch (e) {}
  render({ focus: true });
}
addEventListener("popstate", e => { const st = e.state || { view: "home", arg: null }; S.view = st.view; S.arg = st.arg; S.q = ""; render({ focus: true }); });
try { history.replaceState({ view: "home", arg: null }, ""); } catch (e) {}

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); go(g.dataset.go, g.dataset.arg || null); return; }
  if (e.target.closest("[data-noop]")) { e.preventDefault(); return; }
  const d = e.target.closest("[data-dial]");
  if (d) { S[d.dataset.dial] = d.dataset.val; save(); render(); return; }
  if (e.target.closest("[data-deliv]")) { S.deliv = !S.deliv; render(); document.querySelector("[data-deliv]").focus(); return; }
  if (e.target.closest("[data-veg]")) { S.veg = !S.veg; save(); render(); document.querySelector("[data-veg]").focus(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "store") { S.store = e.target.value; render(); document.getElementById("store").focus(); }
  if (e.target.id === "sort") { S.sort = e.target.value; render(); document.getElementById("sort").focus(); }
});
document.addEventListener("input", e => {
  if (e.target.id !== "q") return;
  S.q = e.target.value; const pos = e.target.selectionStart; render();
  const el = document.getElementById("q"); el.focus(); el.setSelectionRange(pos, pos);
});
render();
</script>
</body>
</html>
