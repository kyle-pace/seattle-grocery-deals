<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seattle Grocery Deals directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Barlow+Condensed:wght@700&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Fraunces:ital,opsz,wght@1,9..144,900&family=Inter:wght@400;600;700;800&family=Rubik+Mono+One&family=Space+Mono:wght@400;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
/* Shell: a quiet viewer around three loud mockups. Mockups are scoped by .d1/.d2/.d3 and use container queries, so the phone frame shows true phone layouts. */
:root {
  --shell-bg: #F3F1EE;
  --shell-ink: #1B1720;
  --shell-muted: #5F5866;
  --shell-line: #DCD7D2;
  --shell-accent: #1B1720;
  --font-ui: "Inter", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--shell-bg); color: var(--shell-ink); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #4DA3FF; outline-offset: 2px; }

.shell-top { position: sticky; top: 0; z-index: 20; background: var(--shell-bg); border-bottom: 1px solid var(--shell-line); }
.shell-bar { max-width: 1320px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.shell-title { font-size: 14px; font-weight: 700; margin: 0; white-space: nowrap; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { border: 1px solid var(--shell-line); background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--shell-accent); color: #fff; border-color: var(--shell-accent); }
.viewmode { margin-left: auto; display: none; gap: 0; border: 1px solid var(--shell-line); border-radius: 8px; overflow: hidden; background: #fff; }
.viewmode button { border: 0; background: none; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.viewmode button[aria-pressed="true"] { background: var(--shell-accent); color: #fff; }
@media (min-width: 720px) { .viewmode { display: flex; } }
@media (max-width: 719px) { .shell-top { position: static; } }
.a11y { margin: 10px 0 0; padding-left: 18px; color: var(--shell-muted); font-size: 14px; line-height: 1.5; display: grid; gap: 2px; }
.themes { align-self: start; display: flex; gap: 0; border: 1px solid var(--shell-line); border-radius: 8px; overflow: hidden; background: #fff; justify-self: start; }
.themes button { border: 0; background: none; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.themes button[aria-pressed="true"] { background: var(--shell-accent); color: #fff; }

.about { max-width: 1320px; margin: 0 auto; padding: 20px 16px 8px; display: grid; gap: 12px 32px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .about { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); } }
.about h2 { margin: 0 0 4px; font-size: 22px; text-wrap: balance; }
.about p { margin: 0; color: var(--shell-muted); font-size: 15px; line-height: 1.5; max-width: 65ch; }
.about .meta { display: grid; gap: 8px; font-size: 14px; align-content: start; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--shell-muted); }
.sw i { width: 18px; height: 18px; border-radius: 4px; border: 1px solid rgb(0 0 0 / .12); display: inline-block; }
.proscons { display: grid; gap: 4px; color: var(--shell-muted); line-height: 1.45; }
.proscons b { color: var(--shell-ink); }

.stage-wrap { padding: 16px 16px 48px; }
.stage { max-width: 1320px; margin: 0 auto; container-type: inline-size; border-radius: 14px; overflow: clip; box-shadow: 0 1px 0 var(--shell-line), 0 12px 40px rgb(27 23 32 / .10); }
.stage.phone { width: 390px; height: 800px; overflow-y: auto; border-radius: 44px; border: 12px solid #141016; box-shadow: 0 20px 60px rgb(27 23 32 / .25); }
@media (max-width: 719px) { .stage-wrap { padding: 0; } .stage, .stage.phone { width: auto; height: auto; border: 0; border-radius: 0; box-shadow: none; overflow: visible; } }

/* Shared mockup bits */
.mock { min-height: 100%; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: 0; padding: 0; }
.switch .track { width: 40px; height: 22px; border-radius: 11px; position: relative; flex: none; transition: background .15s; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; transition: transform .15s; }
.switch[aria-checked="true"] .track::after { transform: translateX(18px); }
@media (prefers-reduced-motion: reduce) { .switch .track, .switch .track::after { transition: none; } }
.more { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 700; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== B Newsprint, accessibility first ===== */
.d0 {
  --paper: #F7F5F0; --ink: #141414; --muted: #57534C; --line: #DDD8CE; --line-ui: #8C867B; --tag: #FFE45C; --on-tag: #141414; --red: #B3261E; --focus: #1A5FD6; --raised: #FFFFFF;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
  background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.45; color-scheme: light;
}
@media (prefers-color-scheme: dark) { .d0:not([data-scheme="light"]) { --paper: #151412; --ink: #F2EFE8; --muted: #ADA79C; --line: #2E2B27; --line-ui: #6E685F; --red: #FF8A80; --focus: #7DB0FF; --raised: #1E1C19; color-scheme: dark; } }
.d0[data-scheme="dark"] { --paper: #151412; --ink: #F2EFE8; --muted: #ADA79C; --line: #2E2B27; --line-ui: #6E685F; --red: #FF8A80; --focus: #7DB0FF; --raised: #1E1C19; color-scheme: dark; }
.d0 :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.d0 .skip { position: absolute; left: 12px; top: -60px; background: var(--ink); color: var(--paper); padding: 10px 14px; z-index: 5; }
.d0 .skip:focus { top: 12px; }
.d0 .wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; }
.d0 .mast { padding-block: 28px 18px; border-bottom: 3px solid var(--ink); }
.d0 .wordmark { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; margin: 0; }
.d0 h1 { font-family: var(--display); font-weight: 700; font-size: clamp(40px, 8cqi, 72px); line-height: .95; margin: 10px 0 8px; text-transform: uppercase; text-wrap: balance; }
.d0 .sub { margin: 0; color: var(--muted); font-size: 16px; }
.d0 .bar { position: sticky; top: var(--stick, 0px); z-index: 4; background: var(--paper); border-bottom: 1px solid var(--line-ui); }
.d0 .bar .wrap { display: grid; gap: 10px; padding-block: 12px; }
.d0 .controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.d0 .find { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line-ui); border-radius: 8px; background: var(--raised); padding: 0 12px; min-height: 44px; }
.d0 .find:focus-within { outline: 3px solid var(--focus); outline-offset: 1px; }
.d0 .find label { font-weight: 700; font-size: 15px; white-space: nowrap; }
.d0 .find input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 17px; color: var(--ink); padding: 8px 0; outline: none; }
.d0 .switch { min-height: 44px; font-weight: 700; font-size: 16px; color: var(--ink); padding: 0 4px; }
.d0 .switch .track { width: 44px; height: 26px; border-radius: 13px; background: var(--paper); border: 2px solid var(--line-ui); }
.d0 .switch .track::after { top: 3px; left: 3px; width: 16px; height: 16px; background: var(--line-ui); }
.d0 .switch[aria-checked="true"] .track { background: var(--ink); border-color: var(--ink); }
.d0 .switch[aria-checked="true"] .track::after { background: var(--paper); transform: translateX(18px); }
.d0 .switch .state { font-weight: 400; color: var(--muted); font-size: 14px; }
.d0 .jump { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.d0 .jump a { flex: none; color: var(--ink); text-decoration: none; border: 1.5px solid var(--line-ui); border-radius: 6px; padding: 0 12px; min-height: 36px; display: inline-flex; align-items: center; font-size: 15px; font-weight: 700; }
.d0 .jump a span { font-weight: 400; color: var(--muted); margin-left: 6px; }
.d0 .status { margin: 0; font-size: 15px; color: var(--muted); }
.d0 .story { margin: 24px 0 8px; border: 2px solid var(--ink); padding: 18px 20px; display: grid; gap: 6px; }
.d0 .story .k { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.d0 .story h2 { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; margin: 0; text-transform: uppercase; }
.d0 .story p { margin: 0; max-width: 62ch; }
.d0 .best { margin: 24px 0 0; }
.d0 .best > h2, .d0 .dept > h2 { font-family: var(--display); font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: .02em; margin: 0; padding-bottom: 6px; border-bottom: 3px solid var(--ink); display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0 12px; }
.d0 h2 .n { font-family: var(--body); font-size: 15px; font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0; }
.d0 .best ul { display: grid; gap: 0 32px; }
.d0 .depts { display: grid; gap: 32px 40px; margin: 32px 0 48px; }
.d0 .dept { scroll-margin-top: calc(var(--stick, 0px) + var(--bar-h, 120px) + 12px); }
.d0 ul { list-style: none; margin: 0; padding: 0; }
.d0 li { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.d0 .nm { font-weight: 700; font-size: 17px; line-height: 1.3; margin: 0; }
.d0 .st { margin: 2px 0 0; font-size: 15px; color: var(--muted); }
.d0 .st s { text-decoration-thickness: 1.5px; }
.d0 .st .off { color: var(--red); font-weight: 700; }
.d0 .amt { margin: 0; flex: none; text-align: right; font-family: var(--display); font-weight: 700; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.d0 .amt .cur { font-size: 18px; vertical-align: .55em; margin-right: 1px; }
.d0 .amt .u { font-size: 18px; }
.d0 .amt .lead { display: block; font-family: var(--body); font-size: 13px; font-weight: 700; line-height: 1.2; margin-bottom: 2px; }
.d0 .amt.tag span[aria-hidden] { background: var(--tag); color: var(--on-tag); padding: 4px 8px 2px; display: inline-block; box-shadow: 3px 3px 0 var(--ink); }
.d0 .more { min-height: 44px; font-size: 16px; color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.d0 .empty { padding: 24px 0; color: var(--muted); }
.d0 .foot { border-top: 3px solid var(--ink); padding-block: 18px 40px; color: var(--muted); font-size: 15px; }
@container (min-width: 760px) {
  .d0 .wrap { padding-inline: 40px; }
  .d0 .bar .wrap { grid-template-columns: 1fr; }
  .d0 .story { grid-template-columns: 220px 1fr; align-items: baseline; gap: 4px 28px; }
  .d0 .story .k { grid-column: 1 / -1; }
  .d0 .best ul { grid-template-columns: 1fr 1fr; }
  .d0 .depts { grid-template-columns: 1fr 1fr; }
}


/* B+ personality dials */
.d0 .masthead { border-bottom: 3px solid var(--ink); }
.d0 .masthead .mast { border-bottom: 0; }
.d0 .wordmark { display: flex; align-items: center; gap: 8px; }
.d0 .wordmark svg { width: 26px; height: 26px; flex: none; }
.d0[data-brand="magenta"] { --brand: #B5136F; }
.d0[data-brand="teal"] { --brand: #0B6B6B; }
.d0[data-brand="violet"] { --brand: #5A2DB3; }
.d0[data-brand="blue"] { --brand: #1F4FD1; }
.d0[data-brand]:not([data-brand="none"]) .masthead { background: var(--brand); color: #FFFFFF; border-bottom: 0; }
.d0[data-brand]:not([data-brand="none"]) .masthead .sub { color: #FFFFFF; opacity: .92; }
.d0[data-brand]:not([data-brand="none"]) .best > h2 { border-bottom: 5px solid var(--brand); }
.d0 .story.clip { background: var(--tag); color: var(--on-tag); border-color: var(--on-tag); box-shadow: 5px 5px 0 var(--ink); }
.d0 .story.clip .k { color: var(--on-tag); }
.d0[data-tilt="on"] .story.clip { transform: rotate(-0.8deg); }
.d0[data-tilt="on"] .amt.tag span[aria-hidden] { transform: rotate(-3deg); }
.d0[data-dept="on"] .dept > h2 { border-bottom: 6px solid var(--c); }
.d0[data-dept="on"] .dept > h2::before { content: ""; width: 18px; height: 18px; background: var(--c); border: 2px solid var(--ink); flex: none; margin-right: 10px; align-self: center; }
.d0[data-dept="on"] .dept > h2 .t { margin-right: auto; }
.d0[data-dept="on"] .jump a { border-left: 8px solid var(--c); }
@media (prefers-reduced-motion: reduce) { .d0[data-tilt="on"] .story.clip, .d0[data-tilt="on"] .amt.tag span[aria-hidden] { transform: none; } }
.dials { display: grid; gap: 8px; }
.dial { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; }
.dial > span { font-weight: 700; min-width: 120px; }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--shell-line); border-radius: 8px; overflow: hidden; background: #fff; }
.seg button { border: 0; background: none; padding: 6px 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.seg button[aria-pressed="true"] { background: var(--shell-accent); color: #fff; }


/* Seattle green */
.d0[data-brand="evergreen"] { --brand: #1D4D33; }
.d0[data-brand="action"] { --brand: #69BE28; --on-brand: #141414; }
.d0[data-brand]:not([data-brand="none"]) .masthead { color: var(--on-brand, #FFFFFF); }
.d0[data-brand]:not([data-brand="none"]) .masthead .sub { color: var(--on-brand, #FFFFFF); }
.d0[data-paper="sage"] { --paper: #EEF2EA; --muted: #4F564C; --line: #D3DBCD; --line-ui: #7F8A7A; --raised: #FFFFFF; }
@media (prefers-color-scheme: dark) { .d0[data-paper="sage"]:not([data-scheme="light"]) { --paper: #111612; --muted: #A3AE9F; --line: #263028; --line-ui: #66725F; --raised: #18201A; } }
.d0[data-paper="sage"][data-scheme="dark"] { --paper: #111612; --muted: #A3AE9F; --line: #263028; --line-ui: #66725F; --raised: #18201A; }
.d0 .treeline { display: none; }

.d0[data-trees="on"]:not([data-brand="none"]) .masthead .mast { padding-bottom: 6px; }

/* ===== D1 Crosswalk ===== */
.d1 {
  --ink: #16101C; --paper: #FFFFFF;
  --meat: #FF5247; --bakery: #FF9F1C; --dairy: #FFE14D; --produce: #4CD07D; --seafood: #4DA3FF; --frozen: #A77BFF; --snacks: #FF9ECF; --pantry: #7FD3F7; --prepared: #C9925E;
  --display: "Bricolage Grotesque", "Arial Narrow", sans-serif; --body: "Inter", system-ui, sans-serif;
  background: var(--ink); color: var(--ink); font-family: var(--body);
}
.d1 .head { color: var(--paper); padding: 40px 24px 20px; display: grid; gap: 8px; }
.d1 .brand { font-weight: 600; font-size: 14px; }
.d1 h1 { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 7cqi, 64px); line-height: 1.02; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.d1 .sub { opacity: .72; font-size: 14px; margin: 0; }
.d1 .switch { color: var(--paper); border: 1.5px solid rgb(255 255 255 / .6); border-radius: 999px; padding: 8px 16px 8px 10px; font-weight: 600; font-size: 15px; justify-self: start; margin-top: 8px; }
.d1 .switch .track { background: rgb(255 255 255 / .25); }
.d1 .switch .track::after { background: var(--paper); }
.d1 .switch[aria-checked="true"] .track { background: var(--produce); }
.d1 .switch[aria-checked="true"] .track::after { background: var(--ink); }
.d1 .jump { display: flex; gap: 6px; overflow-x: auto; padding: 0 24px 20px; scrollbar-width: none; }
.d1 .jump a { flex: none; text-decoration: none; color: var(--ink); background: var(--c); font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; }
.d1 .story { background: var(--paper); padding: 20px 24px; display: grid; gap: 4px; }
.d1 .story .k { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }

function renderNews() {
  const q = (state.q || "").trim().toLowerCase();
  const match = i => !q || i.n.toLowerCase().includes(q) || i.s.toLowerCase().includes(q);
  const best = standouts();
  const bestKeys = new Set(best.map(i => i.n + "|" + i.s));
  const ds = depts().map(d => ({ ...d, items: d.items.filter(match) })).filter(d => d.items.length);
  const shownCount = ds.reduce((n, d) => n + (q ? d.items.length : d.count), 0);
  const s = story();
  return `<div class="mock d0" data-brand="${state.brand}" data-paper="${state.paper}" data-trees="${state.trees}" data-dept="${state.dept}" data-tilt="${state.tilt}"${state.theme !== "auto" ? ` data-scheme="${state.theme}"` : ""}>
    <a class="skip" href="#d0-main">Skip to deals</a>
    <header class="masthead"><div class="wrap mast"><p class="wordmark">${PERSIMMON}Seattle Grocery Deals</p><h1>The week of Oct 23</h1>
      <p class="sub">${DATA.total} deals from ${DATA.stores} stores. Sales run through Thursday, Oct 29.</p></div><div class="treeline" aria-hidden="true"></div></header>
    <div class="bar"><div class="wrap">
      <div class="controls">
        <div class="find"><label for="d0-q">Find</label><input id="d0-q" type="search" placeholder="persimmon, tofu, 99 Ranch" value="${esc(state.q || "")}" autocomplete="off"></div>
        <button class="switch" role="switch" aria-checked="${state.veg}" data-veg><span class="track" aria-hidden="true"></span>Vegetarian only <span class="state" aria-hidden="true">${state.veg ? "On" : "Off"}</span></button>
      </div>
      <nav class="jump" aria-label="Jump to a department">${ds.map(d => `<a href="#d0-${d.k}" style="--c:${DEPTC[d.k]}">${esc(d.label)}<span>${q ? d.items.length : d.count}</span></a>`).join("")}</nav>
    </div></div>
    <main class="wrap" id="d0-main" tabindex="-1">
      <p class="status visually-hidden" role="status">${q ? `${shownCount} deals match “${esc(state.q)}”` : `${shownCount} deals${state.veg ? ", vegetarian only" : ""}`}</p>
      ${q ? "" : `<section class="story${state.brand !== "none" || state.tilt === "on" ? " clip" : ""}" aria-labelledby="d0-story"><div class="k">This week</div><h2 id="d0-story">${s.title}</h2><p>${esc(s.text)}</p></section>
      <section class="best" aria-labelledby="d0-best"><h2 id="d0-best">Best this week <span class="n">biggest drops from the regular price</span></h2><ul>${best.map(i => newsRow(i, true)).join("")}</ul></section>`}
      ${ds.length ? `<div class="depts">${ds.map(d => `<section class="dept" id="d0-${d.k}" style="--c:${DEPTC[d.k]}" aria-labelledby="d0-h-${d.k}"><h2 id="d0-h-${d.k}"><span class="t">${esc(d.label)}</span> <span class="n">${q ? d.items.length + " found" : d.count + " deals"}</span></h2>
        <ul>${(q ? d.items : shown(d, 5)).map(i => newsRow(i, bestKeys.has(i.n + "|" + i.s))).join("")}</ul>${q ? "" : moreBtn(d, 5)}</section>`).join("")}</div>`
      : `<p class="empty">No deals match “${esc(state.q)}” this week. Try a shorter word or a store name.</p>`}
    </main>
    <footer class="wrap foot">Prices come from each store's own weekly flyer. Check the store before you go.</footer>
  </div>`;
}

const RENDER = { news: renderNews, crosswalk: renderCrosswalk, riso: renderRiso, night: renderNight };

function renderAbout() {
  const a = ABOUT[state.d];
  const seg = (key, label, opts) => `<div class="dial"><span>${label}</span><div class="seg" role="group" aria-label="${label}">${opts.map(([v, t, c]) => `<button type="button" data-dial="${key}" data-val="${v}" aria-pressed="${state[key] === v}">${c ? `<i style="background:${c}"></i>` : ""}${t}</button>`).join("")}</div></div>`;
  const theme = state.d === "news" ? `<div class="dials">
    ${seg("brand", "Masthead color", [["evergreen","Evergreen","#1D4D33"],["action","Action green","#69BE28"],["magenta","Magenta","#B5136F"],["teal","Teal","#0B6B6B"],["violet","Violet","#5A2DB3"],["blue","Blue","#1F4FD1"],["none","Plain",""]])}
    ${seg("paper", "Paper", [["sage","Sage"],["cream","Cream"]])}
    ${seg("trees", "Treeline", [["on","On"],["off","Off"]])}
    ${seg("dept", "Department colors", [["on","On"],["off","Off"]])}
    ${seg("tilt", "Tilted tags", [["on","On"],["off","Off"]])}
    ${seg("theme", "Light or dark", [["auto","Match device"],["light","Light"],["dark","Dark"]])}</div>` : "";
  document.getElementById("about").innerHTML = `<div><h2>${a.name}</h2><p>${a.line}</p>${a.a11y ? `<ul class="a11y">${a.a11y.map(x => `<li>${x}</li>`).join("")}</ul>` : ""}</div>
    <div class="meta"><div class="swatches">${a.sw.map(([n, h]) => `<span class="sw"><i style="background:${h}"></i>${n}</span>`).join("")}</div>
    <div class="proscons"><span>${a.fonts}</span><span><b>Good:</b> ${a.pro}</span><span><b>Risk:</b> ${a.con}</span></div>${theme}</div>`;
}
function render() {
  document.querySelectorAll(".tab").forEach(t => { const on = t.dataset.d === state.d; t.setAttribute("aria-selected", on); t.tabIndex = on ? 0 : -1; });
  const stage = document.getElementById("stage");
  stage.setAttribute("aria-labelledby", "tab-" + state.d);
  stage.classList.toggle("phone", state.mode === "phone");
  document.querySelectorAll(".viewmode button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === state.mode));
  renderAbout();
  stage.innerHTML = RENDER[state.d]();
  const top = document.querySelector(".shell-top");
  const pinned = state.mode !== "phone" && getComputedStyle(top).position === "sticky";
  stage.style.setProperty("--stick", pinned ? top.offsetHeight + "px" : "0px");
  const bar = stage.querySelector(".bar"); if (bar) stage.style.setProperty("--bar-h", bar.offsetHeight + "px");
}
document.addEventListener("input", e => {
  if (e.target.id !== "d0-q") return;
  state.q = e.target.value; const pos = e.target.selectionStart; render();
  const el = document.getElementById("d0-q"); el.focus(); el.setSelectionRange(pos, pos);
});
addEventListener("resize", () => { const top = document.querySelector(".shell-top"); const stage = document.getElementById("stage"); const pinned = state.mode !== "phone" && getComputedStyle(top).position === "sticky"; stage.style.setProperty("--stick", pinned ? top.offsetHeight + "px" : "0px"); });
document.addEventListener("click", e => {
  const dl = e.target.closest("[data-dial]");
  if (dl) { const k = dl.dataset.dial; state[k] = dl.dataset.val; render(); document.querySelector(`[data-dial="${k}"][data-val="${state[k]}"]`).focus(); return; }
  const sk = e.target.closest(".skip");
  if (sk) { e.preventDefault(); const m = document.getElementById("d0-main"); m.focus(); m.scrollIntoView(); return; }
  const t = e.target.closest(".tab");
  if (t) { state.d = t.dataset.d; history.replaceState(null, "", "#" + state.d); render(); return; }
  const m = e.target.closest(".viewmode button");
  if (m) { state.mode = m.dataset.mode; try { localStorage.setItem("sgd-mock-mode", state.mode); } catch (err) {} render(); return; }
  if (e.target.closest("[data-veg]")) { state.veg = !state.veg; try { localStorage.setItem("sgd-mock-veg", state.veg ? "1" : "0"); } catch (err) {} render(); document.querySelector("[data-veg]").focus(); return; }
  const more = e.target.closest("[data-more]");
  if (more) { const k = more.dataset.more; state.open[k] = !state.open[k]; render(); const b = document.querySelector(`[data-more="${k}"]`); if (b) b.focus(); return; }
  const a = e.target.closest(".jump a");
  if (a) { e.preventDefault(); const el = document.getElementById(a.getAttribute("href").slice(1)); if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); }
});
document.querySelector(".tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const ids = ["news", "crosswalk", "riso", "night"]; let i = ids.indexOf(state.d);
  i = (i + (e.key === "ArrowRight" ? 1 : 3)) % 4; state.d = ids[i]; render(); document.getElementById("tab-" + state.d).focus();
});
const h = location.hash.slice(1); if (RENDER[h]) state.d = h;
render();
</script>
</body>
</html>
