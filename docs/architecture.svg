  <text x="1020" y="210" font-size="22" font-weight="700" fill="#1B1F1D">Amplitude</text>
  <text class="s" x="1020" y="240">Private analytics for</text>
  <text class="s" x="1020" y="264">the site and the app</text>
  <rect x="1195" y="182" width="53" height="24" rx="12" fill="#2F6B4F"/>
  <text class="pill" x="1221.5" y="199" text-anchor="middle" fill="#FFFFFF">LIVE</text>
  <rect x="1000" y="320" width="260" height="140" rx="12" fill="#EEEEEA" stroke="#9AA09C" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="1020" y="360" font-size="22" font-weight="700" fill="#7A807C">API + Postgres</text>
  <text class="s" x="1020" y="390">Deferred: not in any path.</text>
  <text class="s" x="1020" y="414">Kept as a learning</text>
  <text class="s" x="1020" y="438">project for later.</text>
  <rect x="1000" y="660" width="260" height="116" rx="12" fill="#FFFFFF" stroke="#1B1F1D" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="1020" y="700" font-size="22" font-weight="700" fill="#1B1F1D">Apple Push (APNs)</text>
  <text class="s" x="1020" y="730">Delivers to phones</text>
  <text class="s" x="1020" y="754">that subscribed</text>
  <path class="hotd" d="M940 712H1000" marker-end="url(#g)"/>
  <rect x="1320" y="170" width="260" height="92" rx="12" fill="#E6EFEA" stroke="#1B1F1D" stroke-width="2.5"/>
  <text x="1340" y="210" font-size="22" font-weight="700" fill="#1B1F1D">Reminders</text>
  <text class="s" x="1340" y="240">Shared list, Siri</text>
  <rect x="1320" y="300" width="260" height="450" rx="12" fill="#FFE45C" stroke="#1B1F1D" stroke-width="2.5"/>
  <text x="1340" y="340" font-size="22" font-weight="700" fill="#1B1F1D">iPhone app</text>
  <text class="s" x="1340" y="370">SwiftUI, on TestFlight</text>
  <text class="s" x="1340" y="394">List, watches, widget,</text>
  <text class="s" x="1340" y="418">Siri, deal sheet</text>
  <text class="s" x="1340" y="442"></text>
  <text class="s" x="1340" y="466">Local alerts: watch hits,</text>
  <text class="s" x="1340" y="490">ending soon</text>
  <text class="s" x="1340" y="514">Background refresh:</text>
  <text class="s" x="1340" y="538">planned</text>
  <rect x="1320" y="840" width="260" height="140" rx="12" fill="#FFFFFF" stroke="#1B1F1D" stroke-width="2.5"/>
  <text x="1340" y="880" font-size="22" font-weight="700" fill="#1B1F1D">Website</text>
  <text class="s" x="1340" y="910">seattlegrocery.deals</text>
  <text class="s" x="1340" y="934">One search box:</text>
  <text class="s" x="1340" y="958">prototype, not live</text>
  <path class="ln" d="M1450 248V300" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="hotd" d="M1260 712H1320" marker-end="url(#g)"/>
  <text class="glab" x="1262" y="700">push</text>
  <path class="ln" d="M620 805H1450V750" marker-end="url(#a)"/>
  <text class="lab" x="1000" y="826">week.json, fetched on open</text>
  <path class="ln" d="M620 890H1320" marker-end="url(#a)"/>
  <text class="lab" x="1000" y="882">pages</text>
