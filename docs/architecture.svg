<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Atkinson Hyperlegible Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F1A24"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#24577A"/></marker>
    <style>
      .t { font-size: 22px; font-weight: 700; fill: #0F1A24; }
      .s { font-size: 16px; fill: #536472; }
      .lane { font-size: 24px; font-weight: 800; letter-spacing: 1.5px; fill: #0F1A24; }
      .lab { font-size: 15px; font-weight: 700; fill: #0F1A24; }
      .glab { font-size: 15px; font-weight: 700; fill: #24577A; }
      .box { fill: #FFFFFF; stroke: #0F1A24; stroke-width: 2.5; }
      .ln { stroke: #0F1A24; stroke-width: 2.5; fill: none; }
      .hot { stroke: #24577A; stroke-width: 5; fill: none; }
      .pill { font-size: 13px; font-weight: 700; letter-spacing: 0.8px; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#EEF3F6"/>
  <text x="40" y="58" font-size="38" font-weight="800" fill="#0F1A24">Seattle Grocery Deals: architecture</text>
  <text x="40" y="88" class="s">Solid is live, grey is deferred. The blue path is one store's new flyer becoming a "New deals are in" push. No servers of our own.</text>

  <g class="lane"><text x="40" y="140">1. FLYERS</text><text x="360" y="140">2. PUBLISH</text><text x="680" y="140">3. NOTIFY</text><text x="1000" y="140">4. DELIVER</text><text x="1320" y="140">5. PEOPLE</text></g>
  <g stroke="#D3DEE5" stroke-width="2"><path d="M330 120V970M650 120V970M970 120V970M1290 120V970"/></g>

  <!-- 1. Flyers -->
  <rect class="box" x="40" y="170" width="260" height="116" rx="12"/>
  <text class="t" x="60" y="210">Store flyers</text>
  <text class="s" x="60" y="240">Each store's own site,</text>
  <text class="s" x="60" y="264">16 stores</text>
  <rect class="box" x="40" y="330" width="260" height="140" rx="12"/>
  <text class="t" x="60" y="370">Flyer watcher</text>
  <text class="s" x="60" y="400">GitHub Action, every</text>
  <text class="s" x="60" y="424">30 minutes; starts an</text>
  <text class="s" x="60" y="448">update for that store</text>
  <rect class="box" x="40" y="510" width="260" height="164" rx="12"/>
  <text class="t" x="60" y="550">Flyer update</text>
  <text class="s" x="60" y="580">Claude Code routine reads</text>
  <text class="s" x="60" y="604">one store, merges it into</text>
  <text class="s" x="60" y="628">the week file, pushes to</text>
  <text class="s" x="60" y="652">main. Flags go to Kyle.</text>
  <path class="ln" d="M170 286V330" marker-end="url(#a)"/>
  <text class="lab" x="180" y="314">page changed</text>
  <path class="hot" d="M170 470V510" marker-end="url(#g)"/>

  <!-- 2. Publish -->
  <rect class="box" x="360" y="170" width="260" height="116" rx="12"/>
  <text class="t" x="380" y="210">KitchenCatalog</text>
  <text class="s" x="380" y="240">Shared item ids and</text>
  <text class="s" x="380" y="264">matching (vendored copy)</text>
  <rect class="box" x="360" y="510" width="260" height="140" rx="12"/>
  <text class="t" x="380" y="550">GitHub Actions</text>
  <text class="s" x="380" y="580">Validate, build, deploy</text>
  <text class="s" x="380" y="604">on every push to main,</text>
  <text class="s" x="380" y="628">and hourly</text>
  <rect class="box" x="360" y="780" width="260" height="116" rx="12"/>
  <text class="t" x="380" y="820">GitHub Pages</text>
  <text class="s" x="380" y="850">Website, /api/week.json,</text>
  <text class="s" x="380" y="874">/api/popular.json (static)</text>
  <path class="ln" d="M490 286V510" marker-end="url(#a)"/>
  <text class="lab" x="500" y="390">names, ids,</text>
  <text class="lab" x="500" y="410">ranking</text>
  <path class="hot" d="M300 580H360" marker-end="url(#g)"/>
  <text class="glab" x="304" y="568">push</text>
  <path class="ln" d="M490 650V780" marker-end="url(#a)"/>

  <!-- 3. Notify -->
  <rect class="box" x="680" y="510" width="260" height="140" rx="12"/>
  <text class="t" x="700" y="550">Notify job</text>
  <text class="s" x="700" y="580">After deploy; once per</text>
  <text class="s" x="700" y="604">flyer, guarded by a</text>
  <text class="s" x="700" y="628">notified/&lt;store&gt; tag</text>
  <rect class="box" x="680" y="690" width="260" height="130" rx="12"/>
  <text class="t" x="700" y="730">Firebase (FCM)</text>
  <text class="s" x="700" y="760">Topics: store-&lt;id&gt;,</text>
  <text class="s" x="700" y="784">new-deals. Keyless</text>
  <text class="s" x="700" y="808">sign-in from GitHub</text>
  <path class="hot" d="M620 580H680" marker-end="url(#g)"/>
  <path class="hot" d="M810 650V690" marker-end="url(#g)"/>

  <!-- 4. Deliver -->
  <rect class="box" x="1000" y="170" width="260" height="116" rx="12"/>
  <text class="t" x="1020" y="210">Amplitude</text>
  <text class="s" x="1020" y="240">Private analytics for</text>
  <text class="s" x="1020" y="264">the site and the app</text>
  <rect class="box" x="1000" y="330" width="260" height="140" rx="12" fill="#E4EAEE" stroke="#8A99A5" stroke-dasharray="9 6"/>
  <text x="1020" y="370" font-size="22" font-weight="700" fill="#6B7A86">API + Postgres</text>
  <text class="s" x="1020" y="400">Deferred: not in any path.</text>
  <text class="s" x="1020" y="424">Kept as a learning</text>
  <text class="s" x="1020" y="448">project for later.</text>
  <rect class="box" x="1000" y="690" width="260" height="116" rx="12"/>
  <text class="t" x="1020" y="730">Apple Push (APNs)</text>
  <text class="s" x="1020" y="760">Delivers to phones</text>
  <text class="s" x="1020" y="784">that subscribed</text>
  <path class="hot" d="M940 748H1000" marker-end="url(#g)"/>

  <!-- 5. People -->
  <rect class="box" x="1320" y="170" width="260" height="92" rx="12"/>
  <text class="t" x="1340" y="210">Reminders</text>
  <text class="s" x="1340" y="240">Shared list, Siri</text>
  <rect x="1320" y="300" width="260" height="490" rx="12" fill="#DCE8F0" stroke="#0F1A24" stroke-width="2.5"/>
  <text class="t" x="1340" y="340">iPhone app</text>
  <text class="s" x="1340" y="370">SwiftUI, on TestFlight</text>
  <text class="s" x="1340" y="410">This week: Best of your</text>
  <text class="s" x="1340" y="434">stores, season cards</text>
  <text class="s" x="1340" y="458">Aisles, Stores, List, Search</text>
  <text class="s" x="1340" y="498">Watches, widget, Siri,</text>
  <text class="s" x="1340" y="522">deal sheet</text>
  <text class="s" x="1340" y="562">Push for your stores;</text>
  <text class="s" x="1340" y="586">in-app messages</text>
  <text class="s" x="1340" y="626">Local alerts: watch hits,</text>
  <text class="s" x="1340" y="650">ending soon</text>
  <text class="s" x="1340" y="690">Your list and watches are</text>
  <text class="s" x="1340" y="714">matched on the phone.</text>
  <text class="s" x="1340" y="754">Background refresh: planned</text>
  <rect class="box" x="1320" y="840" width="260" height="140" rx="12"/>
  <text class="t" x="1340" y="880">Website</text>
  <text class="s" x="1340" y="910">seattlegrocery.deals</text>
  <text class="s" x="1340" y="934">Best of your stores, map,</text>
  <text class="s" x="1340" y="958">a list kept in the browser</text>
  <path class="ln" d="M1450 262V300" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="hot" d="M1260 748H1320" marker-end="url(#g)"/>
  <text class="glab" x="1264" y="736">push</text>
  <path class="ln" d="M620 830H1450V792" marker-end="url(#a)"/>
  <text class="lab" x="1000" y="823">week.json, fetched on open</text>
  <path class="ln" d="M620 886H1320" marker-end="url(#a)"/>
  <text class="lab" x="1000" y="878">pages</text>
</svg>
