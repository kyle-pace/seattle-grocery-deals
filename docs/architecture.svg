  <text class="lab" x="304" y="525">merge</text>
  <path class="ln" d="M490 596V780" marker-end="url(#a)"/>
  <rect x="680" y="480" width="260" height="140" rx="12" fill="#FFFFFF" stroke="#1B1F1D" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="700" y="520" font-size="22" font-weight="700" fill="#1B1F1D">Push send step</text>
