<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" font-family="Atkinson Hyperlegible Next, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#141414"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1D4D33"/></marker>
    <style>
      .box { fill: #FFFFFF; stroke: #141414; stroke-width: 2.5; }
      .plan { fill: #FFFFFF; stroke: #141414; stroke-width: 2.5; stroke-dasharray: 9 6; }
      .t { font-size: 22px; font-weight: 700; fill: #141414; }
      .s { font-size: 16px; fill: #57534C; }
      .lane { font-family: Barlow Condensed, Arial Narrow, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 1px; fill: #141414; }
      .lab { font-size: 15px; fill: #141414; font-weight: 700; }
      .ln { stroke: #141414; stroke-width: 2.5; fill: none; }
      .hot { stroke: #1D4D33; stroke-width: 5; fill: none; }
    </style>
  </defs>
  <rect width="1600" height="920" fill="#F7F5F0"/>
  <text x="40" y="58" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-size="40" font-weight="700" fill="#141414">SEATTLE GROCERY DEALS: ARCHITECTURE</text>
  <text x="40" y="88" class="s">Solid boxes are live. Dashed boxes are planned. The green path is the weekly "New deals are in" push.</text>

  <!-- lanes -->
  <g class="lane"><text x="40" y="140">1. WEEKLY DATA</text><text x="360" y="140">2. PUBLISH</text><text x="680" y="140">3. BACKEND</text><text x="1000" y="140">4. NOTIFY</text><text x="1320" y="140">5. PEOPLE</text></g>
  <g stroke="#DDD8CE" stroke-width="2"><path d="M330 120V880M650 120V880M970 120V880M1290 120V880"/></g>

  <!-- 1 weekly data -->
  <rect class="box" x="40" y="170" width="260" height="96" rx="10"/><text class="t" x="58" y="208">Store flyers</text><text class="s" x="58" y="236">Each store's own site</text>
  <rect class="box" x="40" y="330" width="260" height="110" rx="10"/><text class="t" x="58" y="368">Friday routine</text><text class="s" x="58" y="396">Claude cloud agent</text><text class="s" x="58" y="420">Fridays 10am Pacific</text>
  <rect class="box" x="40" y="510" width="260" height="110" rx="10"/><text class="t" x="58" y="548">Pull request</text><text class="s" x="58" y="576">Week file on GitHub</text><text class="s" x="58" y="600">Owner reviews, merges</text>

  <!-- 2 publish -->
  <rect class="box" x="360" y="510" width="260" height="110" rx="10"/><text class="t" x="378" y="548">GitHub Actions</text><text class="s" x="378" y="576">Validate, analyze,</text><text class="s" x="378" y="600">build, deploy</text>
  <rect class="box" x="360" y="700" width="260" height="110" rx="10"/><text class="t" x="378" y="738">GitHub Pages</text><text class="s" x="378" y="766">Website</text><text class="s" x="378" y="790">+ /api/week.json</text>

  <!-- 3 backend -->
  <rect class="plan" x="680" y="330" width="260" height="130" rx="10"/><text class="t" x="698" y="368">API (TypeScript)</text><text class="s" x="698" y="396">publish-week, weeks,</text><text class="s" x="698" y="420">stores, devices,</text><text class="s" x="698" y="444">watches</text>
  <rect class="plan" x="680" y="530" width="260" height="110" rx="10"/><text class="t" x="698" y="568">Postgres on Neon</text><text class="s" x="698" y="596">deals, devices,</text><text class="s" x="698" y="620">watches, push log</text>
  <rect class="plan" x="360" y="170" width="260" height="130" rx="10"/><text class="t" x="378" y="208">Amplitude</text><text class="s" x="378" y="236">Events from the app,</text><text class="s" x="378" y="260">the website and</text><text class="s" x="378" y="284">the push job</text>

  <!-- 4 notify -->
  <rect class="plan" x="1000" y="170" width="260" height="130" rx="10" style="stroke:#1D4D33;stroke-width:4"/><text class="t" x="1018" y="208">Push job</text><text class="s" x="1018" y="236">1. "New deals are in"</text><text class="s" x="1018" y="260">2. Watch hits</text><text class="s" x="1018" y="284">3. Store follows</text>
  <rect class="plan" x="1000" y="380" width="260" height="110" rx="10"/><text class="t" x="1018" y="418">Firebase Cloud</text><text class="t" x="1018" y="444">Messaging</text><text class="s" x="1018" y="472">Topics + device tokens</text>
  <rect class="plan" x="1000" y="560" width="260" height="90" rx="10"/><text class="t" x="1018" y="598">Apple Push (APNs)</text><text class="s" x="1018" y="626">and Android delivery</text>

  <!-- 5 people -->
  <rect class="box" x="1320" y="380" width="240" height="260" rx="22" style="fill:#FFE45C"/><text class="t" x="1340" y="418">iPhone app</text><text class="s" x="1340" y="446" style="fill:#141414">SwiftUI, Liquid Glass</text><text class="s" x="1340" y="470" style="fill:#141414">List in Reminders</text><text class="s" x="1340" y="494" style="fill:#141414">Widget, Siri, watches</text>
  <rect class="box" x="1320" y="700" width="240" height="110" rx="10"/><text class="t" x="1340" y="738">Website</text><text class="s" x="1340" y="766">seattlegrocery.deals</text>
  <rect class="box" x="1320" y="190" width="240" height="96" rx="10" style="fill:#E8F0EA"/><text class="t" x="1340" y="228">Reminders</text><text class="s" x="1340" y="256">Shared list, Siri</text>

  <!-- arrows: weekly data -->
  <path class="ln" d="M170 266V326" marker-end="url(#a)"/>
  <path class="ln" d="M170 440V506" marker-end="url(#a)"/>
  <path class="ln" d="M300 565H356" marker-end="url(#a)"/><text class="lab" x="304" y="548">merge</text>
  <path class="ln" d="M490 620V696" marker-end="url(#a)"/>
  <path class="ln" d="M620 755H1316" marker-end="url(#a)"/><text class="lab" x="980" y="745">pages + JSON</text>
  <!-- publish to backend (hot path) -->
  <path class="hot" d="M560 510V395H676" marker-end="url(#g)"/><text class="lab" x="552" y="460" text-anchor="end" style="fill:#1D4D33">publish week</text>
  <path class="ln" d="M810 460V526" marker-end="url(#a)"/>
  <path class="hot" d="M810 330V235H996" marker-end="url(#g)"/><text class="lab" x="830" y="225" style="fill:#1D4D33">new week</text>
  <path class="hot" d="M1130 300V376" marker-end="url(#g)"/>
  <path class="hot" d="M1130 490V556" marker-end="url(#g)"/>
  <path class="hot" d="M1260 605H1316" marker-end="url(#g)"/><text class="lab" x="1268" y="595" style="fill:#1D4D33">push</text>
  <!-- app to api, app to reminders -->
  <path class="ln" d="M1320 505H960V445H944" marker-end="url(#a)" style="stroke-dasharray:6 5"/><text class="lab" x="1112" y="528" text-anchor="end">token, watches</text>
  <path class="ln" d="M1440 380V290" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="ln" d="M1320 440H1290V420" style="display:none"/>
  <!-- feed to app -->
  <path class="ln" d="M1440 700V534" marker-end="url(#a)" style="display:none"/>
  <!-- analytics -->
  
</svg>
