  <text class="s" x="700" y="574">once a week, guarded by</text>
  <text class="s" x="700" y="598">a notified/&lt;week&gt; tag</text>
  <rect x="680" y="660" width="260" height="116" rx="12" fill="#FFFFFF" stroke="#1B1F1D" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="700" y="700" font-size="22" font-weight="700" fill="#1B1F1D">Firebase (FCM)</text>
  <text class="s" x="700" y="730">Topics: new-deals,</text>
