  <text x="380" y="520" font-size="22" font-weight="700" fill="#1B1F1D">GitHub Actions</text>
  <text class="s" x="380" y="550">Validate, analyze,</text>
  <text class="s" x="380" y="574">build, deploy</text>
  <rect x="360" y="780" width="260" height="116" rx="12" fill="#FFFFFF" stroke="#1B1F1D" stroke-width="2.5"/>
  <text x="380" y="820" font-size="22" font-weight="700" fill="#1B1F1D">GitHub Pages</text>
  <text class="s" x="380" y="850">Website +</text>
  <text class="s" x="380" y="874">/api/week.json (static)</text>
  <path class="ln" d="M490 274V480" marker-end="url(#a)"/>
  <text class="lab" x="500" y="380">names, ids,</text>
  <text class="lab" x="500" y="400">ranking</text>
