  </defs>
  <rect width="1600" height="1000" fill="#F7F5F0"/>
  <text x="40" y="58" font-size="38" font-weight="800" fill="#1B1F1D" font-family="Barlow Condensed, Arial Narrow, sans-serif">SEATTLE GROCERY DEALS: ARCHITECTURE</text>
  <text x="40" y="88" class="s">Solid is live, dashed is planned, grey is deferred. The green path is the planned "New deals are in" push. No servers of our own.</text>

  <g font-family="Barlow Condensed, Arial Narrow, sans-serif" font-size="26" font-weight="700" letter-spacing="1" fill="#141414"><text x="40" y="140">1. WEEKLY DATA</text><text x="360" y="140">2. PUBLISH</text><text x="680" y="140">3. NOTIFY</text><text x="1000" y="140">4. DELIVER</text><text x="1320" y="140">5. PEOPLE</text></g>
  <g stroke="#DDD8CE" stroke-width="2"><path d="M330 120V970M650 120V970M970 120V970M1290 120V970"/></g>
  <rect x="40" y="170" width="260" height="116" rx="12" fill="#FFFFFF" stroke="#1B1F1D" stroke-width="2.5"/>
  <text x="60" y="210" font-size="22" font-weight="700" fill="#1B1F1D">Store flyers</text>
  <text class="s" x="60" y="240">Each store's own site,</text>
  <text class="s" x="60" y="264">12 stores</text>
  <rect x="40" y="320" width="260" height="140" rx="12" fill="#FFFFFF" stroke="#1B1F1D" stroke-width="2.5"/>
  <text x="60" y="360" font-size="22" font-weight="700" fill="#1B1F1D">Friday routine</text>
  <text class="s" x="60" y="390">Claude cloud routine,</text>
  <text class="s" x="60" y="414">Fridays 10am Pacific.</text>
  <text class="s" x="60" y="438">Catalog suggests keys</text>
  <rect x="40" y="480" width="260" height="116" rx="12" fill="#FFFFFF" stroke="#1B1F1D" stroke-width="2.5"/>
  <text x="60" y="520" font-size="22" font-weight="700" fill="#1B1F1D">Pull request</text>
  <text class="s" x="60" y="550">Week file on GitHub;</text>
  <text class="s" x="60" y="574">owner reviews, merges</text>
  <path class="ln" d="M170 286V320" marker-end="url(#a)"/>
  <path class="ln" d="M170 460V480" marker-end="url(#a)"/>
  <rect x="360" y="170" width="260" height="116" rx="12" fill="#FFFFFF" stroke="#1B1F1D" stroke-width="2.5"/>
  <text x="380" y="210" font-size="22" font-weight="700" fill="#1B1F1D">KitchenCatalog</text>
